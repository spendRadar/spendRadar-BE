spring.datasource.url=jdbc:h2:file:./data/ledger;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update


# Hibernate 테이블 갱신 전에 기존 H2 스키마의 호환성을 정리합니다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/demo-schema.sql
