name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check upload candidates
        run: python3 scripts/check_repository.py
      - name: Test and build
        run: bash ./gradlew test bootJar

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecast-server/requirements-test.txt
      - run: python -m pip install -r forecast-server/requirements-test.txt
      - name: Test forecast contract without model download
        working-directory: forecast-server
        run: python -m pytest -q
