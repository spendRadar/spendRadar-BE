# Explicit opt-in demo dataset; this uses a different DB from the normal demo profile.
spring.datasource.url=jdbc:h2:file:./data/synthetic-ledger;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=file:./data/synthetic/seed.sql
spring.sql.init.encoding=UTF-8
