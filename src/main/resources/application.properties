spring.application.name=ai-ledger
spring.profiles.default=demo
server.address=127.0.0.1
server.port=8080
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.config.import=optional:file:./application-local.properties


# 키가 비어 있어도 CRUD와 서버 시작은 가능합니다. 실제 키는 환경변수로 설정합니다.
app.ai.openai-key=${OPENAI_API_KEY:}
app.ai.openai-model=${OPENAI_MODEL:gpt-5.4-mini}
app.ai.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.chronos-url=${CHRONOS_URL:}
app.ai.chronos-token=${CHRONOS_API_TOKEN:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:120}
app.ai.min-history-days=${AI_MIN_HISTORY_DAYS:90}
